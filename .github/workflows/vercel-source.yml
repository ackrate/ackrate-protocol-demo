name: Vercel source checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, prod]
permissions:
  contents: read
concurrency:
  group: vercel-source-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ACKRATE_CLI_RUNTIME_START: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: |
          npm run check:branding
          npm run check:workflow-pins
          npm run check:starters
          npm run typecheck
          npm run test:cli
          npm run test:hackathon
          npm run test:wallet
          npm run check:marketplace
          npm audit --audit-level=high
